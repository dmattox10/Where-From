server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # wherefrom.danielmattox.com. No backend of any kind: the deck, the
    # shuffle and the saved game all live in the browser, which is the whole
    # point of the app. nginx serves a folder and nothing else.
    #
    # The caching below is the only part of this file doing real work, and it
    # is doing it for a PWA rather than an ordinary site. An installed web app
    # is a copy of itself sitting on someone's phone; what decides whether they
    # ever see a new version is whether the service worker can be re-fetched.
    # Get that wrong and the mistake is not "stale for an hour", it is a
    # permanently frozen install that no amount of redeploying reaches.

    # The service worker. Exact match, so it beats every regex block below.
    #
    # Never cached, deliberately. sw.js is the one file in the build whose
    # name is NOT content-hashed, so a cached copy is indistinguishable from a
    # current one and the browser has no reason to ask again. Browsers do cap
    # service worker caching at 24h, but that is a backstop and not a plan:
    # a day of serving a dead build to installed users is a day of the app
    # quietly ignoring the deploy.
    location = /sw.js {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri =404;
    }

    # The manifest is what the install prompt and the home-screen icon read.
    # Not hashed either, and it changes whenever the name, theme colour or
    # icon set does, so it revalidates rather than sticking.
    location = /manifest.webmanifest {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # Vite hashes everything in here — JS, CSS and the Outfit woff2 subsets —
    # so the name changes whenever the bytes do and these can be cached hard.
    #
    # The ^~ is load-bearing. nginx tests regex locations before plain prefix
    # ones, so without it the extension block further down would win for every
    # file in here and these assets would silently lose their immutable
    # caching. Copied deliberately from the danielmattox.com config, where the
    # same line is there for the same reason.
    location ^~ /assets/ {
        # nosniff matters here in particular: this block serves the JS and CSS
        # bundles, and MIME sniffing is how a mistyped asset becomes script.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # workbox-<hash>.js, which sw.js pulls in with importScripts. Content
    # hashed like the assets above but living at the root rather than under
    # /assets/, so it needs its own rule to get the same treatment.
    location ~* ^/workbox-[0-9a-f]+\.js$ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # A request that names a file must 404 when the file is missing, instead of
    # falling through to the SPA below and answering 200 with the homepage.
    # A person sees a wrong page; a crawler or an install prompt sees a success
    # and keeps the dead URL on file.
    #
    # The icons live here. They are copied out of public/ verbatim and are NOT
    # hashed, so they revalidate on a short clock rather than being pinned for
    # a year — replacing an app icon should not require renaming the file.
    location ~* \.(png|jpe?g|gif|svg|ico|woff2?|ttf|eot|json|txt|xml|map)$ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        add_header Cache-Control "public, max-age=3600, must-revalidate" always;
        try_files $uri =404;
    }

    location / {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # index.html names the hashed assets, so it must always revalidate or a
        # browser holding a copy never learns about a new deploy.
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}
